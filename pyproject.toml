[project]
name = "us-macro-risk-monitor"
version = "2.0.0"
requires-python = ">=3.11,<3.15"

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = ["snapshots", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = [
  "E501", # catalogue tabulaire et fragments HTML/CSS multilignes
  "S101", # les assertions sont intentionnelles dans les tests unittest
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]
