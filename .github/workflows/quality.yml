name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Compile
        run: PYTHONPYCACHEPREFIX=/tmp/macro_pycache python -m py_compile catalog.py scoring.py data.py snapshot_contract.py snapshot_builder.py ui.py dashboard_view.py app.py app_server.py scripts/verify_fred_public.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Static quality
        run: ruff check .
      - name: Defensive security scan
        run: bandit -c pyproject.toml -r .
      - name: Dependency audit
        run: pip-audit --local
