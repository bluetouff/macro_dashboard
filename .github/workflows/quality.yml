name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Compile
        run: PYTHONPYCACHEPREFIX=/tmp/macro_pycache python -m py_compile catalog.py scoring.py data.py snapshot_contract.py snapshot_builder.py ui.py dashboard_view.py app.py app_server.py scripts/verify_fred_public.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Static quality
        run: ruff check .
      - name: Defensive security scan
        run: bandit -c pyproject.toml -r .
      - name: Dependency audit
        run: pip-audit --local
