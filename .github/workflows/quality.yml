name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Bootstrap pip with a verified offline wheel
        run: |
          pip_bootstrap=$(mktemp -d)
          pip_wheel="$pip_bootstrap/pip-26.2.2-py3-none-any.whl"
          curl --fail --silent --show-error --proto '=https' --max-time 60 https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl --output "$pip_wheel"
          test "$(sha256sum "$pip_wheel" | cut -d ' ' -f 1)" = fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70
          python -m pip --isolated install --disable-pip-version-check --no-index --no-deps "$pip_wheel"
      - name: Install pinned dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Compile
        run: PYTHONPYCACHEPREFIX=/tmp/macro_pycache python -m py_compile catalog.py scoring.py data.py snapshot_contract.py snapshot_builder.py ui.py dashboard_view.py app.py app_server.py scripts/verify_fred_public.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Static quality
        run: ruff check .
      - name: Defensive security scan
        run: bandit -c pyproject.toml -r .
      - name: Dependency audit
        run: pip-audit --local
